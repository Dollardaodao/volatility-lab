name: Offline research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-and-release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline test dependencies
        run: python -m pip install -e '.[test]'
      - name: Numerical, timing and accounting tests
        run: python -m unittest discover -s tests -v
      - name: Verify published result consistency
        run: python scripts/verify_release.py
      - name: Rebuild reports and check for drift
        run: |
          python scripts/build_research_report.py
          git diff --exit-code -- docs/RESEARCH_REPORT.md
